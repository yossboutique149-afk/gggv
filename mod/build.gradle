plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Bloqueo de dependencias: permite generar mod/gradle.lockfile, que es el
// fichero que los escáneres de vulnerabilidades (OSV, Dependabot) pueden leer.
// Generarlo con: gradle build --write-locks
configurations {
    compileClasspath { resolutionStrategy.activateDependencyLocking() }
    runtimeClasspath { resolutionStrategy.activateDependencyLocking() }
}

// Versiones parcheadas de las librerias transitivas que aporta Minecraft.
// El mod no las empaqueta: en el juego las provee el propio Minecraft. Fijarlas
// deja el lockfile libre de advisories conocidos y evita compilar contra APIs
// ya vulnerables. Ver README para el detalle del runtime del juego.
def libreriasParcheadas = [
    'io.netty:netty-buffer:4.1.137.Final',
    'io.netty:netty-codec:4.1.137.Final',
    'io.netty:netty-common:4.1.137.Final',
    'io.netty:netty-handler:4.1.137.Final',
    'io.netty:netty-resolver:4.1.137.Final',
    'io.netty:netty-transport:4.1.137.Final',
    'io.netty:netty-transport-classes-epoll:4.1.137.Final',
    'io.netty:netty-transport-native-epoll:4.1.137.Final',
    'io.netty:netty-transport-native-unix-common:4.1.137.Final',
    'com.google.guava:guava:33.7.2-jre',
    'com.google.guava:failureaccess:1.0.2'
]

['compileClasspath', 'runtimeClasspath'].each { nombre ->
    configurations.getByName(nombre).resolutionStrategy {
        libreriasParcheadas.each { coordenada -> force coordenada }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
